name: Daily Clips

on:
  schedule:
    - cron: "23 10 * * *"   # 10:23 UTC daily
  workflow_dispatch:
    inputs:
      run_youtube:
        description: "Make today's YouTube clip (best active campaign)"
        type: boolean
        default: true
      campaign:
        description: "Optional: force one campaign (e.g. tjr)"
        required: false
        default: ""
      vod_url:
        description: "Optional: a specific Kick VOD link to clip"
        required: false
        default: ""
      run_tokyo_girl:
        description: "Make the Tokyo Girl TikTok edit"
        type: boolean
        default: true
      run_scout:
        description: "Look for new campaigns / retire finished ones"
        type: boolean
        default: true
      refresh_research:
        description: "Redo the trend research now (normally every 3 days)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-clips
  cancel-in-progress: false

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      APPROVE_URL: ${{ vars.APPROVE_URL }}   # the Google Apps Script link (optional)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r requirements-clips.txt

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Cache Rockstar character clips
        uses: actions/cache@v4
        with:
          path: ~/.cache/rockstar
          key: rockstar-gta6-clips-v1

      - name: Set run date
        run: echo "RUN_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Scout campaigns (new ones to join, retire finished ones)
        if: github.event_name == 'schedule' || inputs.run_scout
        continue-on-error: true
        run: python scripts/clips/scout.py

      - name: Research what's getting views (top clips + trending Shorts)
        continue-on-error: true
        env:
          FORCE_RESEARCH: ${{ inputs.refresh_research }}
        run: python scripts/clips/research.py

      - name: Today's YouTube clip (waits for your approval before posting)
        if: always() && (github.event_name == 'schedule' || inputs.run_youtube)
        continue-on-error: true
        env:
          VOD_URL: ${{ inputs.vod_url }}
          FORCE_CAMPAIGN: ${{ inputs.campaign }}
        run: python scripts/clips/daily.py

      - name: Tokyo Girl TikTok edit (email)
        if: always() && (github.event_name == 'schedule' || inputs.run_tokyo_girl)
        continue-on-error: true
        run: python scripts/clips/tokyo_girl.py

      - name: Save state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "clips-bot"
            git config user.email "actions@github.com"
            git add state/
            git commit -m "Clips state: $RUN_DATE"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi

      - name: Keep the videos for 7 days (approvals post from here)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clips
          path: clips_output/*.mp4
          retention-days: 7
          if-no-files-found: ignore
