name: Daily Clips (Bichou + TJR + Tokyo Girl)

on:
  schedule:
    - cron: "23 10 * * *"   # 10:23 UTC daily
  workflow_dispatch:
    inputs:
      vod_url:
        description: "Optional: a specific Kick VOD link to clip (kick.com/bichouu/videos/... or kick.com/tjr/videos/...)"
        required: false
        default: ""
      refresh_research:
        description: "Redo the trend research now (normally every 3 days)"
        type: boolean
        default: false
      run_bichou:
        description: "Make Bichou clips (paused in campaigns.py)"
        type: boolean
        default: false
      run_tjr:
        description: "Make TJR clips"
        type: boolean
        default: true
      run_tokyo_girl:
        description: "Make the Tokyo Girl edit"
        type: boolean
        default: true

permissions:
  contents: write  # to save state/clips_state.json

concurrency:
  group: daily-clips
  cancel-in-progress: false

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      PUBLISH_TIME_UK: ${{ vars.PUBLISH_TIME_UK }}   # optional repo variable, e.g. 23:00 (default)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r requirements-clips.txt

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Cache Rockstar character clips
        uses: actions/cache@v4
        with:
          path: ~/.cache/rockstar
          key: rockstar-gta6-clips-v1

      - name: Set run date
        run: echo "RUN_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Research what's getting views (top clips + trending Shorts)
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FORCE_RESEARCH: ${{ inputs.refresh_research }}
        run: python scripts/clips/research.py   # all active campaigns

      - name: Bichou clips (Kick -> YouTube private + email)
        if: github.event_name == 'schedule' || inputs.run_bichou
        continue-on-error: true
        env:
          VOD_URL: ${{ inputs.vod_url }}
        run: python scripts/clips/kick_clipper.py bichou

      - name: TJR clips (Kick -> YouTube private + email)
        if: always() && (github.event_name == 'schedule' || inputs.run_tjr)
        continue-on-error: true
        env:
          VOD_URL: ${{ inputs.vod_url }}
        run: python scripts/clips/kick_clipper.py tjr

      - name: Tokyo Girl TikTok edit (email)
        if: always() && (github.event_name == 'schedule' || inputs.run_tokyo_girl)
        continue-on-error: true
        run: python scripts/clips/tokyo_girl.py

      - name: Save state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "clips-bot"
            git config user.email "actions@github.com"
            git add state/
            git commit -m "Clips state: $RUN_DATE"
            git push
          fi

      - name: Keep the videos for 7 days (backup if an email attachment was too big)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clips-${{ env.RUN_DATE }}
          path: clips_output/*.mp4
          retention-days: 7
          if-no-files-found: ignore
