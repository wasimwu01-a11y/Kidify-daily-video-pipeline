name: Daily Video Pipeline

on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 17 * * *"
    # NOTE: GitHub Actions cron is always UTC, no daylight-saving
    # auto-adjust. Shift both by 1 hour when UK clocks change.
  workflow_dispatch: {}

permissions:
  contents: write  # needed to commit checkpoint files

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for a pending (partially-paid-for) video
        id: check_pending
        run: |
          if [ -f "pending_video/script.json" ]; then
            echo "has_pending=true" >> "$GITHUB_OUTPUT"
            echo "Found a pending video from a previous run - resuming."
          else
            echo "has_pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Load pending video state
        if: steps.check_pending.outputs.has_pending == 'true'
        run: |
          cp pending_video/script.json script.json
          if [ -f "pending_video/clip_manifest.json" ]; then
            cp pending_video/clip_manifest.json clip_manifest.json
          fi

      - name: Generate script
        if: steps.check_pending.outputs.has_pending == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_script.py

      - name: Generate AI video clips (Wan 2.6 via fal.ai)
        id: generate_clips
        env:
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
        run: python scripts/generate_clips.py

      - name: Save checkpoint (protects clips you already paid for)
        if: always()
        run: |
          if [ -f "clip_manifest.json" ] && [ -f "script.json" ]; then
            mkdir -p pending_video
            cp script.json pending_video/script.json
            cp clip_manifest.json pending_video/clip_manifest.json
            git config user.name "kidify-pipeline-bot"
            git config user.email "actions@github.com"
            git add pending_video/
            git commit -m "Checkpoint: clip progress saved" || echo "Nothing new to commit"
            git push
          else
            echo "No clip progress to checkpoint yet."
          fi

      - name: Check if video is complete
        id: check_complete
        if: always()
        run: python scripts/check_complete.py

      - name: Assemble final video (JSON2Video)
        id: assemble
        if: always() && steps.check_complete.outputs.complete == 'true'
        env:
          JSON2VIDEO_API_KEY: ${{ secrets.JSON2VIDEO_API_KEY }}
        run: python scripts/assemble_video.py

      - name: Upload to YouTube
        id: upload
        if: always() && steps.check_complete.outputs.complete == 'true' && steps.assemble.outcome == 'success'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/upload_youtube.py

      - name: Clear checkpoint (upload succeeded - video is fully posted)
        if: always() && steps.upload.outcome == 'success'
        run: |
          git config user.name "kidify-pipeline-bot"
          git config user.email "actions@github.com"
          git rm -r --ignore-unmatch pending_video/
          git commit -m "Checkpoint cleared: video uploaded successfully" || echo "Nothing to commit"
          git push

      - name: Upload artifacts for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output
          path: |
            script.json
            clip_manifest.json
            final_video.mp4
          retention-days: 3
