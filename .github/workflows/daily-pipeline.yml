name: Daily Video Pipeline

on:
  schedule:
    # Morning run: ~8:00am Belfast time (currently BST = UTC+1)
    - cron: "0 7 * * *"
    # Evening run: ~6:00pm Belfast time (currently BST = UTC+1)
    - cron: "0 17 * * *"
    # NOTE: GitHub Actions cron is always UTC and does NOT auto-adjust
    # for daylight saving. When UK clocks go back in autumn (GMT,
    # UTC+0), shift both times back by 1 hour (0 8 * * * and 0 18 * * *)
    # to keep the same real-world posting times. Reverse the change
    # each spring.
  workflow_dispatch: {}  # allows manual "Run workflow" trigger for testing

permissions:
  contents: write  # needed so the workflow can commit checkpoint files

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for a pending (already-paid-for) video
        id: check_pending
        run: |
          if [ -f "pending_video/clip_manifest.json" ]; then
            echo "has_pending=true" >> "$GITHUB_OUTPUT"
            echo "Found a pending video from a previous run that didn't finish - resuming from there instead of generating new clips."
          else
            echo "has_pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Load pending video state
        if: steps.check_pending.outputs.has_pending == 'true'
        run: |
          cp pending_video/script.json script.json
          cp pending_video/clip_manifest.json clip_manifest.json

      - name: Generate script
        if: steps.check_pending.outputs.has_pending == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_script.py

      - name: Generate AI video clips (Wan 2.6 via fal.ai)
        if: steps.check_pending.outputs.has_pending == 'false'
        env:
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
        run: python scripts/generate_clips.py

      - name: Save checkpoint (clips are paid for - protect them)
        if: steps.check_pending.outputs.has_pending == 'false'
        run: |
          mkdir -p pending_video
          cp script.json pending_video/script.json
          cp clip_manifest.json pending_video/clip_manifest.json
          git config user.name "kidify-pipeline-bot"
          git config user.email "actions@github.com"
          git add pending_video/
          git commit -m "Checkpoint: clips generated, awaiting assembly/upload" || echo "Nothing to commit"
          git push

      - name: Assemble final video (JSON2Video)
        env:
          JSON2VIDEO_API_KEY: ${{ secrets.JSON2VIDEO_API_KEY }}
        run: python scripts/assemble_video.py

      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/upload_youtube.py

      - name: Clear checkpoint (upload succeeded)
        if: success()
        run: |
          git config user.name "kidify-pipeline-bot"
          git config user.email "actions@github.com"
          git rm -r --ignore-unmatch pending_video/
          git commit -m "Checkpoint cleared: video uploaded successfully" || echo "Nothing to commit"
          git push

      - name: Upload artifacts for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output
          path: |
            script.json
            clip_manifest.json
            final_video.mp4
          retention-days: 3
