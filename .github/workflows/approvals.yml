name: Approvals

# Triggered by the APPROVE / ACTIVATE links in the emails (via the Google Apps
# Script in apps_script/), or by hand: Actions -> Approvals -> Run workflow.
on:
  repository_dispatch:
    types: [publish-clip, activate-campaign]
  workflow_dispatch:
    inputs:
      action:
        description: "publish = post an approved clip now; activate = switch on a recommended campaign"
        type: choice
        options: [publish, activate]
        default: publish
      id:
        description: "The id from the email"
        required: true

permissions:
  contents: write
  actions: read     # to fetch the stored video from the daily run

concurrency:
  group: approvals
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      ACTION: ${{ github.event.inputs.action || (github.event.action == 'publish-clip' && 'publish' || 'activate') }}
      ITEM_ID: ${{ github.event.inputs.id || github.event.client_payload.id }}
      ITEM_TOKEN: ${{ github.event.client_payload.t }}
      MANUAL: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies (light)
        run: pip install requests google-auth google-auth-oauthlib google-api-python-client

      - name: Find the clip
        id: find
        if: env.ACTION == 'publish'
        run: python scripts/clips/approvals.py locate

      - name: Fetch the stored video
        if: env.ACTION == 'publish' && steps.find.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: clips
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}
          path: downloaded

      - name: ${{ env.ACTION }}
        run: python scripts/clips/approvals.py "$ACTION"

      - name: Save state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "clips-bot"
            git config user.email "actions@github.com"
            git add state/
            git commit -m "Approval: $ACTION $ITEM_ID"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
